apiversion: "modelslim_v1"

default_w4a4_dynamic: &default_w4a4_dynamic
  weight:
    scope: "per_group"
    dtype: "int4"
    symmetric: true
    method: "autoround"
    ext:
      group_size: 128
      scale_dtype: "bfloat16"
  act:
    scope: "per_token"
    dtype: "int4"
    symmetric: true
    method: "minmax"
    ext:
      scale_dtype: "bfloat16"

spec:
  process:
    # 1. Iterative Smooth (第一阶段)
    - type: "iter_smooth"
      alpha: 0.9
      scale_min: 1e-5
      symmetric: False
      enable_subgraph_type: [ "ov", "up-down" ]

    # 2. Quarot 旋转 (处理异常值)
    - type: "quarot"
      online: False
      block_size: -1
      max_tp_size: 4
      # 关闭在线旋转，置空
      down_proj_online_layers: []

    # 3. Iterative Smooth (第二阶段)
    - type: "iter_smooth"
      alpha: 0.9
      scale_min: 1e-5
      symmetric: False
      enable_subgraph_type: [ "norm-linear" ]

    # 4. AutoRound 量化 (优化权重)
    - type: "autoround_quant"
      iters: 400
      enable_minmax_tuning: True
      enable_round_tuning: True
      strategies:
        # 1. Attention W8A8
        - qconfig:
            weight:
              dtype: int8
              scope: per_channel
              symmetric: true
              method: "minmax"
            act: 
              dtype: int8
              scope: per_token
              symmetric: true
              method: "minmax"
          include: ["self_attn"]
        
        # 2. Gate Float (BF16)
        - qconfig:
            weight:
              dtype: float
              scope: per_tensor
              symmetric: true
              method: "minmax"
            act:
              dtype: float
              scope: per_tensor
              symmetric: true
              method: "minmax"
          include: ["mlp.gate"]

        # 3. Last 2 Layers Experts W8A8
        - qconfig:
            weight:
              dtype: int8
              scope: per_channel
              symmetric: true
              method: "minmax"
            act: 
              dtype: int8
              scope: per_token
              symmetric: true
              method: "minmax"
          include: 
            - "model.layers.46.mlp.experts"
            - "model.layers.47.mlp.experts"

        # 4. Default W4A4 (All other layers)
        - qconfig: *default_w4a4_dynamic
          include: ["*"]

  save:
    # 保存格式配置
    - type: "ascendv1_saver"
      part_file_size: 4

  # 校准数据集路径 (请确保该文件存在)
  dataset: "calib_data.json"
